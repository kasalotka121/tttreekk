<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Life Hub</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f0f1a">

<style>

body{
    margin:0;
    font-family:-apple-system;
    background: radial-gradient(circle at top,#4f7cff,#0f0f1a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

/* glass card */
.card{
    width:90%;
    max-width:420px;
    padding:24px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

button{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:16px;
}

</style>
</head>

<body>

<div class="card">

    <h1>Life Hub</h1>
    <p>Твое приложение установлено как PWA 🚀</p>

    <button onclick="alert('Работает как приложение!')">
        Тест кнопки
    </button>

</div>

<script>
// SERVICE WORKER
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
